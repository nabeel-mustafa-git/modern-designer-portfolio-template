version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
    ignore:
      # eslint-config-next plugins do not support ESLint 10 yet
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Keep @types/node aligned with your Node LTS major (currently 22)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
